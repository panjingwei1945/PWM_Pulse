sentence=Three-channel PWM-modulated pulse generation for Arduino Mega 2560.
paragraph=xulab library for PWM-modulated pulse control for experiments. Uses Timer4 for PWM on D8, D7 and D6 and Timer1, Timer3 and Timer5 for independent millisecond pulse timing. Supports pulse trains, constant output, pre-trigger delays and end-of-output ramp down. Requires ATmega2560 at 16 MHz; other AVR boards are not supported.
